plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id "io.freefair.lombok" version "9.2.0"
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

jarJar.enable()

mixin {
    add sourceSets.main, "auram.refmap.json"
    config "mixins.auram.json"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    ivy {
        name = 'Thaumaturge Forge releases'
        url = 'https://github.com/AuramMods/Thaumaturge/releases/download'
        patternLayout {
            artifact 'v[revision]/[artifact]-[revision]-mc1.20.1-forge.[ext]'
        }
        metadataSources { artifact() }
        content { includeModule 'auram.releases', 'thaumaturge' }
    }
    maven {
        url = "https://maven.ftb.dev/releases"
        content { includeGroup "dev.ftb.mods" }
    }
    maven {
        url = "https://api.modrinth.com/maven"
        content { includeModule "maven.modrinth", "mekanism" }
    }
    maven { url "https://maven.bawnorton.com/releases" }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    testImplementation 'junit:junit:4.13.2'
    // Optional runtime targets; compile against the pack's actual Malum/Lodestone APIs.
    compileOnly fg.deobf('curse.maven:journeymap-32274:5789363')
    compileOnly(fg.deobf('dev.ftb.mods:ftb-chunks-forge:2001.3.6') { transitive = false })
    compileOnly(fg.deobf('dev.ftb.mods:ftb-library-forge:2001.2.12') { transitive = false })
    compileOnly(fg.deobf('dev.ftb.mods:ftb-teams-forge:2001.3.1') { transitive = false })
    compileOnly fg.deobf('curse.maven:malum-484064:6646111')
    compileOnly fg.deobf('curse.maven:lodestone-616457:6213794')
    compileOnly fg.deobf("curse.maven:patchouli-${patchouli_version}")
    runtimeOnly fg.deobf("curse.maven:patchouli-${patchouli_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly(annotationProcessor('com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.8'))
    implementation(jarJar('com.github.bawnorton.mixinsquared:mixinsquared-forge:0.3.8')) {
        jarJar.ranged(it, '[0.3.8,)')
    }
    compileOnly(annotationProcessor('io.github.llamalad7:mixinextras-common:0.5.0'))
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.5.0')) {
        jarJar.ranged(it, '[0.5.0,)')
    }
    implementation fg.deobf("curse.maven:projecte-226410:4901949")
    // Optional Tinkers' Construct Vapor hooks, built against the pack versions.
    compileOnly fg.deobf('curse.maven:tinkers-construct-74072:7449219')
    compileOnly fg.deobf('curse.maven:mantle-74924:7414488')
    compileOnly fg.deobf('auram.releases:thaumaturge:1.1.6')
    compileOnly fg.deobf('maven.modrinth:mekanism:uxe1WQp4')
    // Lucent stays optional at runtime. These mixins only use its own Java types.
    compileOnly "curse.maven:lucent-493280:4951434"
    // Oculus exposes the Iris shader-pack state through a mapping-independent API.
    compileOnly 'curse.maven:oculus-581495:6020952'
    
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"))
    runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    exclude 'auram-smoke.refmap.json'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'           : 'mixins.auram.json',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.named('jarJar').configure {
    exclude 'auram-smoke.refmap.json'
    archiveClassifier = 'all'
    manifest.from(tasks.jar.manifest)
    finalizedBy 'reobfJarJar'
}

reobf {
    jarJar {
        // MixinGradle does not associate jarJar with the main source set.
        // Carry its @Shadow mappings into the bundled production artifact.
        extraMappings.from layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg')
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('jarJar')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    // Mixin's processor must see every mixin to emit complete refmaps/Shadow mappings.
    options.incremental = false
}

task deployToModpack(type: Copy) {
    dependsOn 'reobfJarJar'
    from tasks.jarJar
    into file(modpack_deploy)

    rename { String fileName ->
        "Auram.jar"
    }

    doLast {
        println "SUCCESS: Copied build to ../../minecraft/mods/Auram.jar"
    }
}

build.finalizedBy deployToModpack

tasks.register('brandingZip', Zip) {
    dependsOn ':bootstrap:shadowJar'
    archiveFileName = "auram-branding-${project.version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('branding')
    from(project(':bootstrap').layout.buildDirectory.file('libs/auram-bootstrap.jar'))
}
tasks.named('assemble') { dependsOn 'brandingZip' }
tasks.named('build') { dependsOn ':bootstrap:build' }

def extraModsDir = 'extra-mods-1.20.1'
task addnewfoldersmods(type: DefaultTask){
    ant.mkdir(dir: 'extra-mods-1.20.1/');
}
repositories {
    flatDir {
        name "extra-mods"
        dir file(extraModsDir)
    }
}

dependencies
{
    for (extraModJar in fileTree(dir: extraModsDir, include: '*.jar')) {
        def basename = extraModJar.name.substring(0, extraModJar.name.length() - ".jar".length())
        def versionSep = basename.lastIndexOf('-')
        assert versionSep != -1
        def artifactId = basename.substring(0, versionSep)
        def version = basename.substring(versionSep + 1)
        runtimeOnly fg.deobf("extra-mods:$artifactId:$version")}
}
// Separate production-mapped test mod for isolated, headless server validation.
sourceSets {
    smokeTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}
configurations.smokeTestAnnotationProcessor.extendsFrom(configurations.annotationProcessor)
mixin.add(sourceSets.smokeTest, "auram-smoke.refmap.json")
tasks.register('smokeTestJar', Jar) {
    exclude 'auram.refmap.json'
    from sourceSets.smokeTest.output
    archiveClassifier = 'smoke-test'
    manifest.attributes('MixinConfigs': 'mixins.auram.smoke.json')
    finalizedBy 'reobfSmokeTestJar'
}
reobf {
    smokeTestJar {
        extraMappings.from layout.buildDirectory.file('tmp/compileSmokeTestJava/compileSmokeTestJava-mappings.tsrg')
    }
}

// These processor products live outside javac's classes directory. Declaring
// them prevents an up-to-date compile from packaging an absent/partial refmap.
['compileJava', 'compileSmokeTestJava'].each { compileName ->
    tasks.named(compileName, JavaCompile).configure {
        outputs.file(layout.buildDirectory.file("tmp/${compileName}/${compileName}-refmap.json"))
        outputs.file(layout.buildDirectory.file("tmp/${compileName}/${compileName}-mappings.tsrg"))
    }
}

// An isolated, invisible client checks the stitched rock sprites and item models.
if (providers.gradleProperty('rockClientSmoke').isPresent()) {
    minecraft.runs.client {
        workingDirectory project.file('build/rock-client-smoke')
        property 'auram.smoke.rocks', 'true'
        property 'auram.smoke.hiddenWindow', 'true'
        mods {
            auram_patch_smoke { source sourceSets.smokeTest }
        }
    }
    tasks.configureEach {
        if (name == 'runClient') doFirst {
            file('build/rock-client-smoke/auram-rock-client-pass.txt').delete()
            file('build/rock-client-smoke/auram-rock-client-failed.txt').delete()
            def config = file('build/rock-client-smoke/config')
            config.mkdirs()
            new File(config, 'fml.toml').text = 'earlyWindowControl = false\nversionCheck = false\n'
        }
    }
}

// Render every guide spread in a private flat world, without showing a window.
if (providers.gradleProperty('bookClientSmoke').isPresent()) {
    minecraft.runs.client {
        workingDirectory project.file('build/book-client-smoke')
        property 'auram.smoke', 'book'
        property 'auram.smoke.hiddenWindow', 'true'
        args '--width', '1200', '--height', '800'
        mods { auram_patch_smoke { source sourceSets.smokeTest } }
    }
    tasks.configureEach {
        if (name == 'runClient') doFirst {
            def runtime = file('build/book-client-smoke')
            new File(runtime, 'config').mkdirs()
            new File(runtime, 'config/fml.toml').text = 'earlyWindowControl = false\nversionCheck = false\n'
            new File(runtime, 'options.txt').text = 'guiScale:2\nrenderDistance:2\nsimulationDistance:2\nsoundCategory_master:0.0\n'
            new File(runtime, 'auram-book-pass.txt').delete()
            new File(runtime, 'auram-book-failed.txt').delete()
        }
    }
}
